<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Google - Trabalho Front-End</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav aria-label="Navegação principal">
            <a href="#">Gmail</a>
            <a href="#">Imagens</a>
            <a href="#">Aplicativos</a>
            <a href="#">Fazer login</a>
        </nav>
    </header>

    <main>
        <section>
            <img
                src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
                alt="Logo do Google"
            >

            <form action="https://www.google.com/search" method="get">
                <label for="pesquisa">
                    Pesquisar no Google
                </label>

                <input
                    type="search"
                    id="pesquisa"
                    name="q"
                >

                <div>
                    <button type="submit">
                        Pesquisa Google
                    </button>

                    <button type="button">
                        Estou com sorte
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <section>
            <p>Brasil</p>
        </section>

        <nav aria-label="Links do rodapé">
            <a href="#">Sobre</a>
            <a href="#">Publicidade</a>
            <a href="#">Negócios</a>
            <a href="#">Como funciona a Pesquisa</a>
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
            <a href="#">Configurações</a>
        </nav>

        <section>
            <p>
                Clone acadêmico desenvolvido para a disciplina de Front-End.
            </p>
        </section>
    </footer>

</body>
</html>
